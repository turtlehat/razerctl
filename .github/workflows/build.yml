name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Check Linux executable
        if: runner.os == 'Linux'
        run: ./zig-out/bin/razerctl --help

      - name: Check Windows executable
        if: runner.os == 'Windows'
        run: .\zig-out\bin\razerctl.exe --help

  distro-build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base
            packages: arch
          - distro: Fedora 44
            image: fedora:44
            packages: fedora

    steps:
      - name: Install Arch dependencies
        if: matrix.packages == 'arch'
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib git zig hidapi pkgconf tar gzip xz unzip ca-certificates

      - name: Install Fedora dependencies
        if: matrix.packages == 'fedora'
        run: dnf install -y git hidapi-devel pkgconf-pkg-config tar gzip xz unzip ca-certificates

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Fedora Zig
        if: matrix.packages == 'fedora'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
          cache-key: fedora-44

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples

      - name: Run tests
        if: matrix.packages == 'fedora'
        run: zig build test

      - name: Build
        if: matrix.packages == 'fedora'
        run: zig build -Doptimize=ReleaseSafe

      - name: Check executable
        if: matrix.packages == 'fedora'
        run: ./zig-out/bin/razerctl --help

      - name: Build Arch package
        if: matrix.packages == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          install -d -o builder -g builder /home/builder/package
          cp packaging/arch/PKGBUILD /home/builder/package/
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix=razerctl-0.0.1/ HEAD \
            > /home/builder/package/razerctl-0.0.1.tar.gz
          chown -R builder:builder /home/builder/package
          runuser -u builder -- bash -c \
            'cd /home/builder/package && updpkgsums && makepkg --noconfirm'
          mkdir -p artifacts
          cp /home/builder/package/*.pkg.tar.zst artifacts/

      - name: Upload Arch package
        if: matrix.packages == 'arch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: razerctl-arch-x86_64
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error

  arch-package-test:
    name: Arch package installation
    needs: distro-build
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Update Arch
        run: pacman -Syu --noconfirm

      - name: Download Arch package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: razerctl-arch-x86_64
          path: artifacts

      - name: Verify installation and removal
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm artifacts/*.pkg.tar.zst
          useradd --create-home tester
          runuser -u tester -- /usr/bin/razerctl --help
          paths=(
            /usr/bin/razerctl
            /usr/lib/udev/rules.d/70-razerctl.rules
            /usr/share/zsh/site-functions/_razerctl
            /usr/share/licenses/razerctl/LICENSE
          )
          for path in "${paths[@]}"; do
            test -f "$path"
            pacman -Qo "$path"
          done
          pacman -R --noconfirm razerctl
          for path in "${paths[@]}"; do
            test ! -e "$path"
          done
